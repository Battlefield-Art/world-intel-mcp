name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # A full run takes a few minutes. A hung test (a deadlocked asyncio
    # lock prints nothing and uses no CPU) fails the job here instead of
    # holding the runner until the 6-hour platform default.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Coverage ratchet (ROADMAP Phase 24): measured 90% on 2026-09-01
      # after the CLI/collector waves; floor one point under to absorb
      # platform variance between the macOS dev box and these runners.
      # Raise the floor as waves land — never lower it to make a change
      # pass.
      - name: Run tests
        run: pytest -m "not smoke" --cov=world_intel_mcp --cov-fail-under=89

  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python -m compileall -q src
